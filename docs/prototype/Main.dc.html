<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Login / Onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: #0F4C44; text-decoration: none; }
  a:hover { color: #0A332D; text-decoration: underline; }
  input::placeholder { color: #9B9488; }
  input:focus { outline: none; border-color: #0F4C44 !important; box-shadow: 0 0 0 3px rgba(15,76,68,0.12); }
  button { font-family: inherit; cursor: pointer; }
</style>
</helmet>

<!-- page background: same treatment as every other screen -->
<div style="width: 100%; height: 900px; background: #EDE7D8; padding: 36px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; overflow: hidden;">

  <!-- OUTER FRAME: same size/radius as the rest of the app. El color domina según el rol elegido — verde para empleado, naranja para empleador — para que se note de entrada qué perfil vas a usar. -->
  <div style="width: 100%; max-width: 1320px; height: 100%; background: {{frameBg}}; border-radius: 28px; padding: 14px; box-shadow: {{frameShadow}}; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 14px; transition: background .2s;">

    <!-- LEFT: brand panel — contenido y color cambian según rol -->
    <div style="flex: 1 1 480px; min-width: 360px; color: #F3EFE6; padding: 56px 48px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; background-color: {{panelBg}}; border-radius: 20px; transition: background .2s;">

      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: {{logoBg}}; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{logoStroke}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg>
        </div>
        <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em;">{{appName}}</span>
      </div>

      <div style="max-width: 460px;">
        <div style="display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{badgeColor}}; border: 1px solid {{badgeBorder}}; border-radius: 100px; padding: 6px 14px; margin-bottom: 24px;">
          {{badgeText}}
        </div>
        <h1 style="font-family: Georgia, 'Times New Roman', serif; font-size: 40px; line-height: 1.15; font-weight: 400; margin: 0 0 18px; color: #FFFFFF;">
          {{heroHeadline}}
        </h1>
        <p style="font-size: 15px; line-height: 1.6; color: #C7C0B2; margin: 0 0 30px;">
          {{heroSubtext}}
        </p>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <sc-for list="{{bullets}}" as="b" hint-placeholder-count="3">
            <div style="display: flex; gap: 14px; align-items: flex-start;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{bulletIconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px;"><circle cx="12" cy="12" r="10"></circle><path d="M9 12l2 2 4-4"></path></svg>
              <span style="font-size: 14px; color: #E3DFD3;">{{b.text}}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <p style="font-size: 13px; color: {{copyrightColor}}; margin: 0;">© 2026 {{appName}}</p>
    </div>

    <!-- RIGHT: form panel -->
    <div style="flex: 1 1 480px; min-width: 360px; display: flex; align-items: center; justify-content: center; padding: 48px 40px; box-sizing: border-box; background: #FFFFFF; border-radius: 20px; overflow-y: auto;">
      <div style="width: 100%; max-width: 380px;">

        <!-- role toggle -->
        <div style="display: flex; background: #EFEAE0; border-radius: 12px; padding: 4px; margin-bottom: 30px;">
          <button onClick="{{selectEmployee}}" style="flex: 1; border: none; border-radius: 9px; padding: 11px 0; font-size: 14px; font-weight: 600; background: {{employeeBg}}; color: {{employeeColor}}; box-shadow: {{employeeShadow}}; transition: all .15s;">
            Busco empleo
          </button>
          <button onClick="{{selectEmployer}}" style="flex: 1; border: none; border-radius: 9px; padding: 11px 0; font-size: 14px; font-weight: 600; background: {{employerBg}}; color: {{employerColor}}; box-shadow: {{employerShadow}}; transition: all .15s;">
            Busco talento
          </button>
        </div>

        <h2 style="font-size: 22px; font-weight: 700; color: #1C1B18; margin: 0 0 6px;">{{heading}}</h2>
        <p style="font-size: 14px; color: #726C60; margin: 0 0 26px;">{{subheading}}</p>

        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #3D3A33; margin-bottom: 6px;">Email</label>
            <input type="email" placeholder="tu@email.com" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #DDD6C7; border-radius: 10px; font-size: 14px; background: #fff; color: #1C1B18;">
          </div>
          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #3D3A33; margin-bottom: 6px;">Contraseña</label>
            <div style="position: relative;">
              <input type="{{passwordInputType}}" placeholder="••••••••" style="width: 100%; box-sizing: border-box; padding: 12px 44px 12px 14px; border: 1px solid #DDD6C7; border-radius: 10px; font-size: 14px; background: #fff; color: #1C1B18;">
              <button onClick="{{togglePassword}}" type="button" aria-label="{{passwordToggleLabel}}" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: none; background: transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #726C60;">
                <sc-if value="{{showPassword}}" hint-placeholder-val="{{false}}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a20.3 20.3 0 015.06-5.94M9.9 4.24A10.4 10.4 0 0112 4c7 0 11 7 11 7a20.4 20.4 0 01-3.22 4.19M14.12 14.12a3 3 0 11-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </sc-if>
                <sc-if value="{{showPasswordOff}}" hint-placeholder-val="{{true}}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </sc-if>
              </button>
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: -4px;">
            <a href="#" style="font-size: 13px;">¿Olvidaste tu contraseña?</a>
          </div>

          <a href="{{ctaHref}}" style="display: block; width: 100%; box-sizing: border-box; padding: 13px 0; border: none; border-radius: 10px; background: {{ctaBg}}; color: #fff; font-size: 15px; font-weight: 600; margin-top: 4px; text-align: center; text-decoration: none;">
            {{ctaLabel}}
          </a>

          <div style="display: flex; align-items: center; gap: 12px; margin: 8px 0;">
            <div style="flex: 1; height: 1px; background: #E4DFD2;"></div>
            <span style="font-size: 12px; color: #9B9488;">o continuá con</span>
            <div style="flex: 1; height: 1px; background: #E4DFD2;"></div>
          </div>

          <div style="display: flex; gap: 10px;">
            <button style="flex: 1; padding: 12px 0; border: 1px solid #DDD6C7; border-radius: 10px; background: #fff; color: #1C1B18; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;">
              <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"></path><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"></path><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.4C.5 8.3 0 10.1 0 12s.5 3.7 1.4 5.4l4-3.1z"></path><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"></path></svg>
              Google
            </button>
            <button style="flex: 1; padding: 12px 0; border: 1px solid #DDD6C7; border-radius: 10px; background: #fff; color: #1C1B18; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#1C1B18"><path d="M12 0.5C5.65 0.5 0.5 5.65 0.5 12c0 5.08 3.29 9.38 7.86 10.9 0.57 0.1 0.78-0.25 0.78-0.55 0-0.27-0.01-1-0.015-1.96-3.2 0.7-3.88-1.54-3.88-1.54-0.52-1.33-1.28-1.68-1.28-1.68-1.04-0.72 0.08-0.7 0.08-0.7 1.16 0.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36 0.96 0.1-0.75 0.4-1.26 0.73-1.55-2.55-0.29-5.24-1.28-5.24-5.69 0-1.26 0.45-2.29 1.19-3.09-0.12-0.29-0.52-1.47 0.11-3.06 0 0 0.97-0.31 3.18 1.18 0.92-0.26 1.91-0.38 2.9-0.39 0.98 0.01 1.97 0.13 2.9 0.39 2.2-1.49 3.17-1.18 3.17-1.18 0.63 1.59 0.23 2.77 0.11 3.06 0.74 0.8 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68 0.41 0.36 0.78 1.07 0.78 2.15 0 1.55-0.015 2.8-0.015 3.18 0 0.3 0.2 0.66 0.79 0.55C20.21 21.37 23.5 17.08 23.5 12c0-6.35-5.15-11.5-11.5-11.5z"></path></svg>
              GitHub
            </button>
          </div>
        </div>

        <p style="text-align: center; font-size: 13px; color: #726C60; margin-top: 22px;">
          {{footerText}} <a href="#" style="font-weight: 600;">{{footerLink}}</a>
        </p>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"appName":{"editor":"text","default":"Conecta"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.state.role ?? 'employee';
    const isEmployee = role === 'employee';
    const showPassword = this.state.showPassword ?? false;

    const employeeBullets = [
      { text: 'Seguimiento claro del estado de cada postulación' },
      { text: 'Match por habilidades reales, no por palabras exactas' },
      { text: 'Un solo perfil, postulate con un clic' },
    ];
    const employerBullets = [
      { text: 'Cada candidato lo revisa una persona de tu equipo, no un filtro automático' },
      { text: 'Pipeline claro por etapas: revisión, entrevista, contratado' },
      { text: 'Motivo de rechazo obligatorio, para dar feedback real' },
    ];

    return {
      appName: this.props.appName ?? 'Conecta',

      selectEmployee: () => this.setState({ role: 'employee' }),
      selectEmployer: () => this.setState({ role: 'employer' }),

      employeeBg: isEmployee ? '#FFFFFF' : 'transparent',
      employeeColor: isEmployee ? '#0F2E29' : '#8A8475',
      employeeShadow: isEmployee ? '0 1px 2px rgba(0,0,0,0.08)' : 'none',

      employerBg: !isEmployee ? '#FFFFFF' : 'transparent',
      employerColor: !isEmployee ? '#0F2E29' : '#8A8475',
      employerShadow: !isEmployee ? '0 1px 2px rgba(0,0,0,0.08)' : 'none',

      // El color dominante se invierte según el rol: verde para empleado, naranja para empleador —
      // así se nota de entrada que cambiaste de perfil.
      frameBg: isEmployee ? '#0F2E29' : '#D97757',
      frameShadow: isEmployee ? '0 30px 60px -20px rgba(15,46,41,0.35)' : '0 30px 60px -20px rgba(166,74,45,0.35)',
      panelBg: isEmployee ? '#15362f' : '#c96a46',
      logoBg: isEmployee ? '#D97757' : '#0F2E29',
      logoStroke: isEmployee ? '#0F2E29' : '#FFFFFF',
      badgeColor: isEmployee ? '#D97757' : '#0F2E29',
      badgeBorder: isEmployee ? 'rgba(217,119,87,0.4)' : 'rgba(15,46,41,0.35)',
      badgeText: isEmployee ? 'Sin filtros de IA' : 'Para empresas',
      bulletIconColor: isEmployee ? '#9FBFB6' : '#0F2E29',
      copyrightColor: isEmployee ? '#7E8A85' : '#4A2213',
      bullets: isEmployee ? employeeBullets : employerBullets,

      heroHeadline: isEmployee
        ? 'Buscá trabajo sin que un algoritmo te descarte primero.'
        : 'Encontrá talento sin perder lo humano en el proceso.',
      heroSubtext: isEmployee
        ? 'Cada postulación la revisa una persona. Y vos ves en todo momento en qué estado está cada una.'
        : 'Tu equipo revisa cada postulante a mano. Transparencia total con cada candidato, en cada etapa.',

      heading: isEmployee ? 'Bienvenido de nuevo' : 'Portal de empresas',
      subheading: isEmployee ? 'Entrá y seguí tus postulaciones.' : 'Entrá y gestioná tus búsquedas.',
      ctaLabel: isEmployee ? 'Iniciar sesión' : 'Iniciar sesión como empresa',
      ctaHref: isEmployee ? 'Dashboard.dc.html' : 'VacantesEmpleador.dc.html',
      ctaBg: isEmployee ? '#0F2E29' : '#D97757',
      footerText: isEmployee ? '¿No tenés cuenta?' : '¿Tu empresa no está registrada?',
      footerLink: isEmployee ? 'Registrate gratis' : 'Crear cuenta de empresa',

      togglePassword: () => this.setState({ showPassword: !showPassword }),
      passwordInputType: showPassword ? 'text' : 'password',
      passwordToggleLabel: showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña',
      showPassword: showPassword,
      showPasswordOff: !showPassword,
    };
  }
}
</script>
</body>
</html>
