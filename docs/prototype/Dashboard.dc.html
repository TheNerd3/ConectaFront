<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dashboard — Mis postulaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: #0F4C44; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .filterbtn { border: 1px solid #DDD6C7; background: #fff; color: #3D3A33; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 100px; white-space: nowrap; }
  .scrollarea::-webkit-scrollbar { width: 8px; }
  .scrollarea::-webkit-scrollbar-thumb { background: #DDD6C7; border-radius: 10px; }
</style>
</helmet>

<!-- page background -->
<div style="width: 100%; height: 900px; background: #EDE7D8; padding: 36px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; overflow: hidden;">

  <!-- OUTER FRAME: fixed size, same for every screen -->
  <div style="width: 100%; max-width: 1320px; height: 100%; background: #0F2E29; border-radius: 28px; padding: 14px; display: flex; gap: 14px; box-shadow: 0 30px 60px -20px rgba(15,46,41,0.35); box-sizing: border-box;">

    <!-- icon-only rail -->
    <div style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; position: relative;">
      <div style="width: 34px; height: 34px; border-radius: 9px; background: #D97757; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; flex: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F2E29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg>
      </div>

      <a href="BuscarEmpleo.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Buscar empleo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
      </a>

      <!-- ACTIVE item: wider white tile, bleeds evenly past both sides of the dark rail -->
      <div style="width: 60px; height: 48px; border-radius: 14px; background: #FFFFFF; color: #0F2E29; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(0,0,0,0.2); flex: none;" title="Mis postulaciones">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path></svg>
      </div>

      <div class="icon-btn" style="color: #9FBFB6;" title="Calendario">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      </div>
      <a href="AnalizadorCV.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Analizador de CV">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>
      </a>
      <a href="MiPerfil.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mi perfil">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>
      <a href="Chat.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mensajes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
      </a>
      <div class="icon-btn" style="color: #9FBFB6;" title="Configuración">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
      </div>

      <div style="margin-top: auto;">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: #D97757; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff;">SC</div>
      </div>
    </div>

    <!-- white content panel: fixed height, internal scroll -->
    <div style="flex: 1 1 0; min-width: 0; height: 100%; background: #FFFFFF; border-radius: 20px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;">

      <!-- fixed header area -->
      <div style="padding: 32px 36px 0; flex: none;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
          <div>
            <h1 style="font-size: 24px; font-weight: 700; color: #1C1B18; margin: 0 0 4px;">Hola, Sol 👋</h1>
            <p style="font-size: 14px; color: #726C60; margin: 0;">Así están tus postulaciones hoy</p>
          </div>
          <a href="Notificaciones.dc.html" class="icon-btn" style="border: 1px solid #EAE4D6; background: #fff; position: relative;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D3A33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 01-3.46 0"></path></svg>
            <span style="position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: #D97757;"></span>
          </a>
        </div>

        <!-- interview reminder banner -->
        <sc-if value="{{hasUpcomingInterview}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 16px; background: #0F2E29; border-radius: 16px; padding: 16px 20px; margin-bottom: 20px; flex-wrap: wrap;">
            <div style="width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; flex: none;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
            </div>
            <div style="flex: 1 1 260px; min-width: 0;">
              <div style="font-size: 14px; font-weight: 700; color: #fff;">{{interviewHeadline}}</div>
              <div style="font-size: 13px; color: #BFD8D0; margin-top: 2px;">{{interviewSubtext}}</div>
            </div>
            <button style="flex: none; display: flex; align-items: center; gap: 8px; background: #fff; color: #0F2E29; font-size: 13px; font-weight: 600; padding: 9px 16px; border: none; border-radius: 10px;">
              <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"></path><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"></path><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.4C.5 8.3 0 10.1 0 12s.5 3.7 1.4 5.4l4-3.1z"></path><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.6l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"></path></svg>
              Ver en Google Calendar
            </button>
          </div>
        </sc-if>

        <!-- stat cards -->
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-bottom: 20px;">
          <div style="background: #F7F4EC; border-radius: 14px; padding: 16px 18px;">
            <div style="font-size: 24px; font-weight: 700; color: #1C1B18;">{{totalCount}}</div>
            <div style="font-size: 13px; color: #726C60; margin-top: 2px;">Postulaciones</div>
          </div>
          <div style="background: #FBF1DE; border-radius: 14px; padding: 16px 18px;">
            <div style="font-size: 24px; font-weight: 700; color: #B3760A;">{{reviewCount}}</div>
            <div style="font-size: 13px; color: #8A6117; margin-top: 2px;">En revisión</div>
          </div>
          <div style="background: #E7F1FB; border-radius: 14px; padding: 16px 18px;">
            <div style="font-size: 24px; font-weight: 700; color: #1C5FA8;">{{interviewCount}}</div>
            <div style="font-size: 13px; color: #1A4F8A; margin-top: 2px;">Entrevistas</div>
          </div>
          <div style="background: #E6F6EC; border-radius: 14px; padding: 16px 18px;">
            <div style="font-size: 24px; font-weight: 700; color: #1D7A4C;">{{acceptedCount}}</div>
            <div style="font-size: 13px; color: #19613D; margin-top: 2px;">Ofertas</div>
          </div>
        </div>

        <!-- filters -->
        <div style="display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px;">
          <button onClick="{{filterAll}}" class="filterbtn" style="background: {{bgAll}}; color: {{colorAll}}; border-color: {{borderAll}};">Todas ({{totalCount}})</button>
          <button onClick="{{filterReview}}" class="filterbtn" style="background: {{bgReview}}; color: {{colorReview}}; border-color: {{borderReview}};">En revisión</button>
          <button onClick="{{filterInterview}}" class="filterbtn" style="background: {{bgInterview}}; color: {{colorInterview}}; border-color: {{borderInterview}};">Entrevista</button>
          <button onClick="{{filterRejected}}" class="filterbtn" style="background: {{bgRejected}}; color: {{colorRejected}}; border-color: {{borderRejected}};">Rechazadas</button>
          <button onClick="{{filterAccepted}}" class="filterbtn" style="background: {{bgAccepted}}; color: {{colorAccepted}}; border-color: {{borderAccepted}};">Aceptadas</button>
        </div>
      </div>

      <!-- scrollable applications grid: stays inside the fixed frame -->
      <div class="scrollarea" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 36px 28px;">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px;">
          <sc-for list="{{applications}}" as="app" hint-placeholder-count="4">
            <div style="background: #F7F4EC; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;">
              <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 40px; height: 40px; border-radius: 10px; background: {{app.logoBg}}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex: none;">{{app.initials}}</div>
                <div style="min-width: 0; flex: 1;">
                  <div style="font-size: 15px; font-weight: 600; color: #1C1B18; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{app.role}}</div>
                  <div style="font-size: 13px; color: #726C60;">{{app.company}}</div>
                </div>
              </div>
              <div style="display: flex; align-items: center; justify-content: space-between;">
                <span style="font-size: 12px; color: #9B9488;">Postulado el {{app.date}}</span>
                <span style="font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 100px; background: {{app.statusBg}}; color: {{app.statusColor}};">{{app.statusLabel}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const filter = this.state.filter ?? 'all';

    const all = [
      { id: 1, role: 'Desarrolladora Frontend', company: 'Nimbus Software', date: '2 oct', initials: 'NS', logoBg: '#1C5FA8', status: 'review' },
      { id: 2, role: 'Full Stack Developer', company: 'Bluecore Labs', date: '29 sep', initials: 'BL', logoBg: '#1D7A4C', status: 'interview' },
      { id: 3, role: 'React Developer SSR', company: 'Atlas Tech', date: '25 sep', initials: 'AT', logoBg: '#B3760A', status: 'review' },
      { id: 4, role: 'Ingeniera de Software', company: 'Grupo Vértice', date: '18 sep', initials: 'GV', logoBg: '#726C60', status: 'rejected' },
      { id: 5, role: 'Frontend Engineer', company: 'Orbita Digital', date: '10 sep', initials: 'OD', logoBg: '#D97757', status: 'accepted' },
      { id: 6, role: 'Desarrolladora JavaScript', company: 'Cedro Soft', date: '3 sep', initials: 'CS', logoBg: '#0F2E29', status: 'interview' },
    ];

    const statusMeta = {
      review:    { label: 'En revisión', bg: '#FBF1DE', color: '#B3760A' },
      interview: { label: 'Entrevista',  bg: '#E7F1FB', color: '#1C5FA8' },
      rejected:  { label: 'Rechazada',   bg: '#ECE7DA', color: '#726C60' },
      accepted:  { label: 'Aceptada',    bg: '#E6F6EC', color: '#1D7A4C' },
    };

    const withMeta = all.map(a => ({
      ...a,
      statusLabel: statusMeta[a.status].label,
      statusBg: statusMeta[a.status].bg,
      statusColor: statusMeta[a.status].color,
    }));

    const applications = filter === 'all' ? withMeta : withMeta.filter(a => a.status === filter);

    const pillStyle = (key) => {
      const active = filter === key;
      return {
        bg: active ? '#0F2E29' : '#fff',
        color: active ? '#fff' : '#3D3A33',
        border: active ? '#0F2E29' : '#DDD6C7',
      };
    };
    const pAll = pillStyle('all');
    const pReview = pillStyle('review');
    const pInterview = pillStyle('interview');
    const pRejected = pillStyle('rejected');
    const pAccepted = pillStyle('accepted');

    const upcomingInterview = { company: 'Bluecore Labs', role: 'Full Stack Developer', when: 'mañana', time: '10:00' };
    const hasUpcomingInterview = !!upcomingInterview;

    return {
      applications,
      totalCount: all.length,
      hasUpcomingInterview,
      interviewHeadline: upcomingInterview ? `Tenés una entrevista ${upcomingInterview.when} a las ${upcomingInterview.time}` : '',
      interviewSubtext: upcomingInterview ? `${upcomingInterview.role} en ${upcomingInterview.company} · agendada en Google Calendar` : '',
      reviewCount: all.filter(a => a.status === 'review').length,
      interviewCount: all.filter(a => a.status === 'interview').length,
      acceptedCount: all.filter(a => a.status === 'accepted').length,

      filterAll: () => this.setState({ filter: 'all' }),
      filterReview: () => this.setState({ filter: 'review' }),
      filterInterview: () => this.setState({ filter: 'interview' }),
      filterRejected: () => this.setState({ filter: 'rejected' }),
      filterAccepted: () => this.setState({ filter: 'accepted' }),

      bgAll: pAll.bg, colorAll: pAll.color, borderAll: pAll.border,
      bgReview: pReview.bg, colorReview: pReview.color, borderReview: pReview.border,
      bgInterview: pInterview.bg, colorInterview: pInterview.color, borderInterview: pInterview.border,
      bgRejected: pRejected.bg, colorRejected: pRejected.color, borderRejected: pRejected.border,
      bgAccepted: pAccepted.bg, colorAccepted: pAccepted.color, borderAccepted: pAccepted.border,
    };
  }
}
</script>
</body>
</html>
