<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Notificaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: #0F4C44; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .filterbtn { border: 1px solid #DDD6C7; background: #fff; color: #3D3A33; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 100px; white-space: nowrap; }
  .scrollarea::-webkit-scrollbar { width: 8px; }
  .scrollarea::-webkit-scrollbar-thumb { background: #DDD6C7; border-radius: 10px; }
</style>
</helmet>

<div style="width: 100%; height: 900px; background: #EDE7D8; padding: 36px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; overflow: hidden;">

  <div style="width: 100%; max-width: 1320px; height: 100%; background: #0F2E29; border-radius: 28px; padding: 14px; display: flex; gap: 14px; box-shadow: 0 30px 60px -20px rgba(15,46,41,0.35); box-sizing: border-box;">

    <!-- icon-only rail: notificaciones no es un destino de la barra, se llega por la campanita, así que ningún ítem queda activo -->
    <div style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; position: relative;">
      <div style="width: 34px; height: 34px; border-radius: 9px; background: #D97757; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; flex: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F2E29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg>
      </div>

      <a href="BuscarEmpleo.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Buscar empleo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
      </a>
      <a href="Dashboard.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mis postulaciones">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path></svg>
      </a>
      <div class="icon-btn" style="color: #9FBFB6;" title="Calendario">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      </div>
      <a href="AnalizadorCV.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Analizador de CV">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>
      </a>
      <a href="MiPerfil.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mi perfil">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>
      <a href="Chat.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mensajes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
      </a>
      <div class="icon-btn" style="color: #9FBFB6;" title="Configuración">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
      </div>

      <div style="margin-top: auto;">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: #D97757; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff;">SC</div>
      </div>
    </div>

    <!-- white content panel -->
    <div style="flex: 1 1 0; min-width: 0; height: 100%; background: #FFFFFF; border-radius: 20px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;">

      <!-- fixed header -->
      <div style="padding: 28px 36px 0; flex: none;">
        <a href="Dashboard.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #726C60; margin-bottom: 14px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          Volver
        </a>
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px;">
          <div>
            <h1 style="font-size: 24px; font-weight: 700; color: #1C1B18; margin: 0 0 4px;">Notificaciones</h1>
            <p style="font-size: 14px; color: #726C60; margin: 0;">{{unreadCount}} sin leer</p>
          </div>
          <button onClick="{{markAllRead}}" style="flex: none; font-size: 13px; font-weight: 600; color: #0F2E29; background: #fff; border: 1px solid #DDD6C7; padding: 9px 16px; border-radius: 10px;">Marcar todas como leídas</button>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px;">
          <button onClick="{{filterAll}}" class="filterbtn" style="background: {{bgAll}}; color: {{colorAll}}; border-color: {{borderAll}};">Todas</button>
          <button onClick="{{filterUnread}}" class="filterbtn" style="background: {{bgUnread}}; color: {{colorUnread}}; border-color: {{borderUnread}};">No leídas ({{unreadCount}})</button>
          <button onClick="{{filterPostulaciones}}" class="filterbtn" style="background: {{bgPostulaciones}}; color: {{colorPostulaciones}}; border-color: {{borderPostulaciones}};">Postulaciones</button>
          <button onClick="{{filterMensajes}}" class="filterbtn" style="background: {{bgMensajes}}; color: {{colorMensajes}}; border-color: {{borderMensajes}};">Mensajes</button>
          <button onClick="{{filterEmpresas}}" class="filterbtn" style="background: {{bgEmpresas}}; color: {{colorEmpresas}}; border-color: {{borderEmpresas}};">Empresas que sigo</button>
        </div>
      </div>

      <!-- scrollable notifications list, agrupadas por fecha -->
      <div class="scrollarea" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 36px 28px;">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <div style="margin-bottom: 18px;">
            <div style="font-size: 12px; font-weight: 700; color: #9B9488; letter-spacing: 0.04em; margin-bottom: 8px;">{{g.label}}</div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <sc-for list="{{g.items}}" as="n" hint-placeholder-count="2">
                <div style="display: flex; align-items: flex-start; gap: 14px; padding: 13px 16px; border-radius: 12px; background: {{n.rowBg}};">
                  <div style="width: 36px; height: 36px; border-radius: 10px; background: {{n.iconBg}}; color: {{n.iconColor}}; display: flex; align-items: center; justify-content: center; flex: none;">
                    <sc-if value="{{n.isCalendar}}" hint-placeholder-val="{{false}}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
                    </sc-if>
                    <sc-if value="{{n.isMessage}}" hint-placeholder-val="{{false}}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
                    </sc-if>
                    <sc-if value="{{n.isReject}}" hint-placeholder-val="{{false}}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
                    </sc-if>
                    <sc-if value="{{n.isBuilding}}" hint-placeholder-val="{{false}}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V7l6-4 6 4v14M9 9h1M9 13h1M14 9h1M14 13h1"></path></svg>
                    </sc-if>
                    <sc-if value="{{n.isBulb}}" hint-placeholder-val="{{false}}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"></path></svg>
                    </sc-if>
                    <sc-if value="{{n.isCheck}}" hint-placeholder-val="{{false}}">
                      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path></svg>
                    </sc-if>
                  </div>
                  <div style="flex: 1; min-width: 0;">
                    <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px;">
                      <span style="font-size: 13px; font-weight: 700; color: #1C1B18;">{{n.title}}</span>
                      <span style="font-size: 11px; color: #9B9488; flex: none;">{{n.time}}</span>
                    </div>
                    <p style="font-size: 13px; color: #4D4A42; margin: 0; line-height: 1.5;">{{n.body}}</p>
                  </div>
                  <sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}">
                    <span style="width: 8px; height: 8px; border-radius: 50%; background: #D97757; flex: none; margin-top: 4px;"></span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const filter = this.state.filter ?? 'all';
    const readIds = this.state.readIds ?? [];

    const raw = [
      { id: 1, group: 'hoy', type: 'postulaciones', icon: 'calendar', iconBg: '#E6F6EC', iconColor: '#1D7A4C', title: 'Entrevista confirmada', body: 'Bluecore Labs confirmó tu entrevista para mañana a las 10:00 por Google Meet.', time: '10:32', unreadDefault: true },
      { id: 2, group: 'hoy', type: 'mensajes', icon: 'message', iconBg: '#E7F1FB', iconColor: '#1C5FA8', title: 'Nuevo mensaje', body: 'Bluecore Labs te escribió en el chat sobre tu postulación.', time: '09:55', unreadDefault: true },
      { id: 3, group: 'ayer', type: 'postulaciones', icon: 'reject', iconBg: '#ECE7DA', iconColor: '#726C60', title: 'Actualización de postulación', body: 'Grupo Vértice no avanzó con tu postulación. Motivo: buscan un perfil más senior para este puesto.', time: 'ayer · 16:40', unreadDefault: false },
      { id: 4, group: 'ayer', type: 'empresas', icon: 'building', iconBg: '#FBF1DE', iconColor: '#B3760A', title: 'Nueva vacante', body: 'Nimbus Software, una empresa que seguís, publicó: Backend Developer.', time: 'ayer · 09:10', unreadDefault: false },
      { id: 5, group: 'semana', type: 'postulaciones', icon: 'bulb', iconBg: '#FBF1DE', iconColor: '#B3760A', title: 'Sugerencia del Analizador de CV', body: 'Te faltan 3 skills para llegar al 90% de match en Full Stack Developer @ Bluecore Labs.', time: 'lun', unreadDefault: false },
      { id: 6, group: 'semana', type: 'postulaciones', icon: 'check', iconBg: '#E6F6EC', iconColor: '#1D7A4C', title: '¡Te hicieron una oferta!', body: 'Orbita Digital quiere avanzar con un contrato formal para Frontend Engineer.', time: 'lun', unreadDefault: false },
    ];

    const withState = raw.map(n => ({
      ...n,
      unread: n.unreadDefault && !readIds.includes(n.id),
    }));

    const filtered = filter === 'all' ? withState
      : filter === 'unread' ? withState.filter(n => n.unread)
      : withState.filter(n => n.type === filter);

    const groupLabels = { hoy: 'Hoy', ayer: 'Ayer', semana: 'Esta semana' };
    const groupOrder = ['hoy', 'ayer', 'semana'];
    const groups = groupOrder
      .map(key => ({
        label: groupLabels[key],
        items: filtered.filter(n => n.group === key).map(n => ({
          ...n,
          isCalendar: n.icon === 'calendar',
          isMessage: n.icon === 'message',
          isReject: n.icon === 'reject',
          isBuilding: n.icon === 'building',
          isBulb: n.icon === 'bulb',
          isCheck: n.icon === 'check',
          rowBg: n.unread ? '#F7F4EC' : 'transparent',
        })),
      }))
      .filter(g => g.items.length > 0);

    const unreadCount = withState.filter(n => n.unread).length;

    const pillStyle = (key) => {
      const active = filter === key;
      return {
        bg: active ? '#0F2E29' : '#fff',
        color: active ? '#fff' : '#3D3A33',
        border: active ? '#0F2E29' : '#DDD6C7',
      };
    };
    const pAll = pillStyle('all');
    const pUnread = pillStyle('unread');
    const pPostulaciones = pillStyle('postulaciones');
    const pMensajes = pillStyle('mensajes');
    const pEmpresas = pillStyle('empresas');

    return {
      groups,
      unreadCount,
      markAllRead: () => this.setState({ readIds: raw.map(n => n.id) }),

      filterAll: () => this.setState({ filter: 'all' }),
      filterUnread: () => this.setState({ filter: 'unread' }),
      filterPostulaciones: () => this.setState({ filter: 'postulaciones' }),
      filterMensajes: () => this.setState({ filter: 'mensajes' }),
      filterEmpresas: () => this.setState({ filter: 'empresas' }),

      bgAll: pAll.bg, colorAll: pAll.color, borderAll: pAll.border,
      bgUnread: pUnread.bg, colorUnread: pUnread.color, borderUnread: pUnread.border,
      bgPostulaciones: pPostulaciones.bg, colorPostulaciones: pPostulaciones.color, borderPostulaciones: pPostulaciones.border,
      bgMensajes: pMensajes.bg, colorMensajes: pMensajes.color, borderMensajes: pMensajes.border,
      bgEmpresas: pEmpresas.bg, colorEmpresas: pEmpresas.color, borderEmpresas: pEmpresas.border,
    };
  }
}
</script>
</body>
</html>
