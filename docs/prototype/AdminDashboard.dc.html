<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Panel de administración — Resumen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: #0F4C44; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .scrollarea::-webkit-scrollbar { width: 8px; }
  .scrollarea::-webkit-scrollbar-thumb { background: #DDD6C7; border-radius: 10px; }
</style>
</helmet>

<div style="width: 100%; height: 900px; background: #EDE7D8; padding: 36px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; overflow: hidden;">

  <div style="width: 100%; max-width: 1320px; height: 100%; background: #2B2A28; border-radius: 28px; padding: 14px; display: flex; gap: 14px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4); box-sizing: border-box;">

    <!-- icon-only rail — identidad propia del admin: gris carbón dominante -->
    <div style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; position: relative;">
      <div style="width: 34px; height: 34px; border-radius: 9px; background: #0F2E29; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; flex: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg>
      </div>

      <!-- ACTIVE: Resumen -->
      <div style="width: 60px; height: 48px; border-radius: 14px; background: #FFFFFF; color: #2B2A28; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(0,0,0,0.25); flex: none;" title="Resumen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
      </div>

      <a href="AdminEmpresas.dc.html" class="icon-btn" style="color: rgba(255,255,255,0.4);" title="Empresas y ofertas">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
      </a>
      <a href="AdminUsuarios.dc.html" class="icon-btn" style="color: rgba(255,255,255,0.4);" title="Usuarios">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 00-3-3.87"></path><path d="M16 3.13a4 4 0 010 7.75"></path></svg>
      </a>

      <div style="margin-top: auto;">
        <div style="width: 34px; height: 34px; border-radius: 9px; background: #C9A227; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #2B2A28;">AD</div>
      </div>
    </div>

    <!-- white content panel -->
    <div style="flex: 1 1 0; min-width: 0; height: 100%; background: #FFFFFF; border-radius: 20px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;">

      <!-- fixed header -->
      <div style="padding: 28px 36px 0; flex: none;">
        <h1 style="font-size: 22px; font-weight: 700; color: #1C1B18; margin: 0 0 2px;">Panel de administración</h1>
        <p style="font-size: 13px; color: #726C60; margin: 0;">Estado general de la plataforma, en tiempo real</p>
      </div>

      <!-- scrollable body -->
      <div class="scrollarea" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 36px 28px; display: flex; flex-direction: column; gap: 18px;">

        <!-- KPIs -->
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px;">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
            <div style="background: {{k.bg}}; border-radius: 14px; padding: 16px 18px;">
              <div style="font-size: 22px; font-weight: 700; color: {{k.color}};">{{k.value}}</div>
              <div style="font-size: 12.5px; color: {{k.labelColor}}; margin-top: 2px;">{{k.label}}</div>
            </div>
          </sc-for>
        </div>

        <!-- crecimiento de usuarios -->
        <div style="background: #F7F4EC; border-radius: 14px; padding: 18px 20px;">
          <div style="font-size: 14px; font-weight: 700; color: #1C1B18; margin-bottom: 2px;">Usuarios nuevos por semana</div>
          <p style="font-size: 12px; color: #726C60; margin: 0 0 16px;">Últimas 6 semanas, empleados y empleadores combinados.</p>
          <div style="display: flex; align-items: flex-end; gap: 14px; height: 110px;">
            <sc-for list="{{growth}}" as="g" hint-placeholder-count="6">
              <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end;">
                <span style="font-size: 11px; font-weight: 700; color: #1C1B18;">{{g.value}}</span>
                <div style="width: 100%; max-width: 36px; height: {{g.barHeight}}px; background: #D97757; border-radius: 6px 6px 2px 2px;"></div>
                <span style="font-size: 10.5px; color: #9B9488;">{{g.label}}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <!-- pendientes de revisión -->
        <div style="background: #F7F4EC; border-radius: 14px; padding: 18px 20px;">
          <div style="font-size: 14px; font-weight: 700; color: #1C1B18; margin-bottom: 12px;">Pendiente de tu revisión</div>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <sc-for list="{{pendingItems}}" as="p" hint-placeholder-count="2">
              <a href="{{p.href}}" style="display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 10px; padding: 12px 14px; text-decoration: none;">
                <div style="width: 34px; height: 34px; border-radius: 9px; background: {{p.iconBg}}; display: flex; align-items: center; justify-content: center; flex: none; color: {{p.iconColor}};">
                  <sc-if value="{{p.isCompany}}" hint-placeholder-val="{{true}}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
                  </sc-if>
                  <sc-if value="{{p.isFlag}}" hint-placeholder-val="{{false}}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
                  </sc-if>
                </div>
                <div style="flex: 1; min-width: 0;">
                  <div style="font-size: 13px; font-weight: 600; color: #1C1B18;">{{p.title}}</div>
                  <div style="font-size: 12px; color: #9B9488;">{{p.subtitle}}</div>
                </div>
                <span style="font-size: 11px; font-weight: 700; color: #fff; background: #B3760A; padding: 4px 10px; border-radius: 100px; flex: none;">{{p.count}}</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9B9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M9 18l6-6-6-6"></path></svg>
              </a>
            </sc-for>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      kpis: [
        { label: 'Usuarios totales', value: '3.482', bg: '#F7F4EC', color: '#1C1B18', labelColor: '#726C60' },
        { label: 'Nuevos esta semana', value: '+127', bg: '#E6F6EC', color: '#1D7A4C', labelColor: '#19613D' },
        { label: 'Empresas activas', value: '214', bg: '#F7F4EC', color: '#1C1B18', labelColor: '#726C60' },
        { label: 'Vacantes activas', value: '389', bg: '#F7F4EC', color: '#1C1B18', labelColor: '#726C60' },
        { label: 'Postulaciones totales', value: '12.904', bg: '#F7F4EC', color: '#1C1B18', labelColor: '#726C60' },
        { label: 'Resp. promedio de empresas', value: '2,4 días', bg: '#FBF1DE', color: '#B3760A', labelColor: '#8A6117' },
      ],
      growth: [
        { label: 'S1', value: 64, barHeight: 38 },
        { label: 'S2', value: 81, barHeight: 48 },
        { label: 'S3', value: 73, barHeight: 44 },
        { label: 'S4', value: 95, barHeight: 58 },
        { label: 'S5', value: 112, barHeight: 70 },
        { label: 'S6', value: 127, barHeight: 80 },
      ],
      pendingItems: [
        { title: 'Empresas pendientes de verificación', subtitle: 'Alta reciente, esperando aprobación', count: 5, href: 'AdminEmpresas.dc.html', isCompany: true, isFlag: false, iconBg: '#F0ECE1', iconColor: '#726C60' },
        { title: 'Ofertas reportadas', subtitle: 'Marcadas por usuarios como spam o sospechosas', count: 3, href: 'AdminEmpresas.dc.html', isCompany: false, isFlag: true, iconBg: '#FBEEE6', iconColor: '#A6472C' },
      ],
    };
  }
}
</script>
</body>
</html>
