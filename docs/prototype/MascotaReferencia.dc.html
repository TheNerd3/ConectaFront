<title>Referencia — Mascota</title>

<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .scrollarea::-webkit-scrollbar { width: 8px; }
  .scrollarea::-webkit-scrollbar-thumb { background: #DDD6C7; border-radius: 10px; }
</style>
</helmet>

<div style="width: 100%; height: 900px; background: #EDE7D8; padding: 36px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; overflow: hidden;">

  <div style="width: 100%; max-width: 1320px; height: 100%; background: #0F2E29; border-radius: 28px; padding: 14px; box-sizing: border-box; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4);">

    <div style="width: 100%; height: 100%; background: #FFFFFF; border-radius: 20px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;">

      <div style="padding: 28px 36px 0; flex: none;">
        <h1 style="font-size: 22px; font-weight: 700; color: #1C1B18; margin: 0 0 2px;">Mascota — hoja de referencia</h1>
        <p style="font-size: 13px; color: #726C60; margin: 0 0 16px;">Alien verde de 3 ojos, chaleco naranja. Todos los estados guardados hasta ahora, con cuándo se usa cada uno.</p>
      </div>

      <div class="scrollarea" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 36px 48px;">
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px;">
          <sc-for list="{{states}}" as="s" hint-placeholder-count="13">
            <div style="background: #F7F4EC; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-sizing: border-box;">
              <img src="{{s.url}}" alt="{{s.label}}" style="width: 100%; height: 100px; object-fit: contain; border-radius: 8px; background: #fff; display: block;">
              <div style="text-align: center;">
                <div style="font-size: 10.5px; font-weight: 700; color: #B3760A; margin-bottom: 2px;">{{s.num}}</div>
                <div style="font-size: 11.5px; font-weight: 600; color: #1C1B18; line-height: 1.25;">{{s.label}}</div>
                <div style="font-size: 10px; color: #9B9488; margin-top: 3px; line-height: 1.25;">{{s.usage}}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
