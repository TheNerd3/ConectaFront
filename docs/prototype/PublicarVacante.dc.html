<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Publicar vacante — Empleador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: #0F4C44; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .scrollarea::-webkit-scrollbar { width: 8px; }
  .scrollarea::-webkit-scrollbar-thumb { background: #DDD6C7; border-radius: 10px; }
  input::placeholder, textarea::placeholder { color: #9B9488; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #D97757 !important; box-shadow: 0 0 0 3px rgba(217,119,87,0.14); }
</style>
</helmet>

<div style="width: 100%; height: 900px; background: #EDE7D8; padding: 36px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; overflow: hidden;">

  <div style="width: 100%; max-width: 1320px; height: 100%; background: #D97757; border-radius: 28px; padding: 14px; display: flex; gap: 14px; box-shadow: 0 30px 60px -20px rgba(166,74,45,0.35); box-sizing: border-box;">

    <!-- icon-only rail — paleta invertida del lado empleador -->
    <div style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; position: relative;">
      <div style="width: 34px; height: 34px; border-radius: 9px; background: #0F2E29; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; flex: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg>
      </div>

      <a href="VacantesEmpleador.dc.html" class="icon-btn" style="color: rgba(15,46,41,0.5);" title="Mis vacantes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V7l6-4 6 4v14M9 9h1M9 13h1M14 9h1M14 13h1"></path></svg>
      </a>

      <!-- ACTIVE: Publicar vacante -->
      <div style="width: 60px; height: 48px; border-radius: 14px; background: #FFFFFF; color: #D97757; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(0,0,0,0.2); flex: none;" title="Publicar vacante">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>

      <div class="icon-btn" style="color: rgba(15,46,41,0.5);" title="Mensajes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
      </div>
      <a href="PerfilEmpresa.dc.html" class="icon-btn" style="color: rgba(15,46,41,0.5);" title="Perfil de empresa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
      </a>
      <a href="ConfiguracionEmpleador.dc.html" class="icon-btn" style="color: rgba(15,46,41,0.5);" title="Configuración">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
      </a>

      <div style="margin-top: auto;">
        <div style="width: 34px; height: 34px; border-radius: 9px; background: #0F2E29; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff;">BL</div>
      </div>
    </div>

    <!-- white content panel -->
    <div style="flex: 1 1 0; min-width: 0; height: 100%; background: #FFFFFF; border-radius: 20px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;">

      <!-- fixed header -->
      <div style="padding: 28px 36px 18px; flex: none; border-bottom: 1px solid #EFEBE0;">
        <a href="VacantesEmpleador.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #726C60; margin-bottom: 10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          Volver a mis vacantes
        </a>
        <h1 style="font-size: 22px; font-weight: 700; color: #1C1B18; margin: 0 0 2px;">Publicar vacante</h1>
        <p style="font-size: 13px; color: #726C60; margin: 0;">Cada postulante que llegue lo va a revisar una persona de tu equipo, no un filtro automático</p>
      </div>

      <!-- scrollable form -->
      <div class="scrollarea" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px 36px 28px;">
        <div style="max-width: 720px; display: flex; flex-direction: column; gap: 20px;">

          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #3D3A33; margin-bottom: 6px;">Puesto</label>
            <input type="text" placeholder="Ej: Full Stack Developer" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #DDD6C7; border-radius: 10px; font-size: 14px; background: #fff; color: #1C1B18;">
          </div>

          <div style="display: flex; gap: 16px;">
            <div style="flex: 1;">
              <label style="display: block; font-size: 13px; font-weight: 600; color: #3D3A33; margin-bottom: 6px;">Modalidad</label>
              <select style="width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #DDD6C7; border-radius: 10px; font-size: 14px; background: #fff; color: #1C1B18;">
                <option>Remoto</option>
                <option>Híbrido</option>
                <option>Presencial</option>
              </select>
            </div>
            <div style="flex: 1;">
              <label style="display: block; font-size: 13px; font-weight: 600; color: #3D3A33; margin-bottom: 6px;">Ubicación</label>
              <input type="text" placeholder="Ej: Buenos Aires, Argentina" style="width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #DDD6C7; border-radius: 10px; font-size: 14px; background: #fff; color: #1C1B18;">
            </div>
          </div>

          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #3D3A33; margin-bottom: 6px;">Rango salarial (opcional)</label>
            <div style="display: flex; gap: 10px; align-items: center;">
              <input type="text" placeholder="Desde" style="flex: 1; box-sizing: border-box; padding: 12px 14px; border: 1px solid #DDD6C7; border-radius: 10px; font-size: 14px; background: #fff; color: #1C1B18;">
              <span style="color: #9B9488; font-size: 13px;">a</span>
              <input type="text" placeholder="Hasta" style="flex: 1; box-sizing: border-box; padding: 12px 14px; border: 1px solid #DDD6C7; border-radius: 10px; font-size: 14px; background: #fff; color: #1C1B18;">
            </div>
            <label style="display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: #726C60;">
              <input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #D97757;">
              Mostrar el rango públicamente en la oferta
            </label>
          </div>

          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #3D3A33; margin-bottom: 6px;">Descripción del puesto</label>
            <textarea placeholder="Contá de qué se trata el rol, el equipo y el día a día" style="width: 100%; height: 100px; box-sizing: border-box; padding: 12px 14px; border: 1px solid #DDD6C7; border-radius: 10px; font-size: 14px; color: #1C1B18; resize: none;"></textarea>
          </div>

          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #3D3A33; margin-bottom: 6px;">Skills buscadas</label>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;">
              <sc-for list="{{skills}}" as="s" hint-placeholder-count="4">
                <span style="display: inline-flex; align-items: center; gap: 6px; background: #FBEEE6; color: #A6472C; font-size: 13px; font-weight: 600; padding: 7px 10px 7px 14px; border-radius: 100px;">
                  {{s.name}}
                  <button onClick="{{s.remove}}" aria-label="Quitar {{s.name}}" style="width: 18px; height: 18px; border: none; background: rgba(166,71,44,0.12); border-radius: 100px; display: flex; align-items: center; justify-content: center; color: #A6472C; padding: 0;">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                  </button>
                </span>
              </sc-for>
            </div>
            <button onClick="{{addSkill}}" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #D97757; background: #FBEEE6; border: 1px dashed #E3A98A; padding: 8px 14px; border-radius: 100px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Agregar skill
            </button>
          </div>

          <div style="display: flex; gap: 12px; margin-top: 8px; padding-bottom: 8px;">
            <a href="VacantesEmpleador.dc.html" style="flex: none; display: flex; align-items: center; justify-content: center; background: #D97757; color: #fff; font-size: 14px; font-weight: 600; padding: 12px 22px; border-radius: 10px; text-decoration: none;">
              Publicar vacante
            </a>
            <a href="VacantesEmpleador.dc.html" style="flex: none; display: flex; align-items: center; justify-content: center; color: #726C60; font-size: 14px; font-weight: 600; padding: 12px 18px; border-radius: 10px; text-decoration: none;">
              Cancelar
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const skillNames = this.state.skillNames ?? ['React', 'Node.js', 'PostgreSQL', 'TypeScript'];

    const skills = skillNames.map((name, i) => ({
      name,
      remove: () => this.setState({ skillNames: skillNames.filter((_, idx) => idx !== i) }),
    }));

    return {
      skills,
      addSkill: () => this.setState({ skillNames: [...skillNames, 'Nueva skill'] }),
    };
  }
}
</script>
</body>
</html>
