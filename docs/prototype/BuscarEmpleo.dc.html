<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscar empleo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: #0F4C44; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .filterbtn { border: 1px solid #DDD6C7; background: #fff; color: #3D3A33; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 100px; white-space: nowrap; }
  .scrollarea::-webkit-scrollbar { width: 8px; }
  .scrollarea::-webkit-scrollbar-thumb { background: #DDD6C7; border-radius: 10px; }
</style>
</helmet>

<!-- page background -->
<div style="width: 100%; height: 900px; background: #EDE7D8; padding: 36px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; overflow: hidden;">

  <!-- OUTER FRAME: fixed size, same for every screen -->
  <div style="width: 100%; max-width: 1320px; height: 100%; background: #0F2E29; border-radius: 28px; padding: 14px; display: flex; gap: 14px; box-shadow: 0 30px 60px -20px rgba(15,46,41,0.35); box-sizing: border-box;">

    <!-- icon-only rail -->
    <div style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; position: relative;">
      <div style="width: 34px; height: 34px; border-radius: 9px; background: #D97757; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; flex: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F2E29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg>
      </div>

      <!-- ACTIVE item: Buscar empleo -->
      <div style="width: 60px; height: 48px; border-radius: 14px; background: #FFFFFF; color: #0F2E29; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(0,0,0,0.2); flex: none;" title="Buscar empleo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
      </div>

      <a href="Dashboard.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mis postulaciones">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path></svg>
      </a>
      <div class="icon-btn" style="color: #9FBFB6;" title="Calendario">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      </div>
      <a href="AnalizadorCV.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Analizador de CV">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>
      </a>
      <a href="MiPerfil.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mi perfil">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>
      <a href="Chat.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mensajes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
      </a>
      <div class="icon-btn" style="color: #9FBFB6;" title="Configuración">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
      </div>

      <div style="margin-top: auto;">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: #D97757; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff;">SC</div>
      </div>
    </div>

    <!-- white content panel: fixed height, internal scroll -->
    <div style="flex: 1 1 0; min-width: 0; height: 100%; background: #FFFFFF; border-radius: 20px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden;">

      <!-- fixed header area -->
      <div style="padding: 32px 36px 0; flex: none;">
        <div style="margin-bottom: 18px;">
          <h1 style="font-size: 24px; font-weight: 700; color: #1C1B18; margin: 0 0 4px;">Buscar empleo</h1>
          <p style="font-size: 14px; color: #726C60; margin: 0;">{{resultsCount}} búsquedas activas que coinciden con tu perfil</p>
        </div>

        <!-- search bar -->
        <div style="display: flex; gap: 10px; margin-bottom: 16px;">
          <div style="flex: 1; position: relative;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9B9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
            <input type="text" placeholder="Puesto, tecnología o empresa" style="width: 100%; box-sizing: border-box; padding: 11px 14px 11px 40px; border: 1px solid #DDD6C7; border-radius: 10px; font-size: 14px; background: #F7F4EC; color: #1C1B18;">
          </div>
          <button style="flex: none; display: flex; align-items: center; gap: 8px; background: #0F2E29; color: #fff; font-size: 14px; font-weight: 600; padding: 0 20px; border: none; border-radius: 10px;">Buscar</button>
        </div>

        <!-- filters -->
        <div style="display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px;">
          <button onClick="{{filterAll}}" class="filterbtn" style="background: {{bgAll}}; color: {{colorAll}}; border-color: {{borderAll}};">Todas</button>
          <button onClick="{{filterRemoto}}" class="filterbtn" style="background: {{bgRemoto}}; color: {{colorRemoto}}; border-color: {{borderRemoto}};">Remoto</button>
          <button onClick="{{filterHibrido}}" class="filterbtn" style="background: {{bgHibrido}}; color: {{colorHibrido}}; border-color: {{borderHibrido}};">Híbrido</button>
          <button onClick="{{filterPresencial}}" class="filterbtn" style="background: {{bgPresencial}}; color: {{colorPresencial}}; border-color: {{borderPresencial}};">Presencial</button>
        </div>
      </div>

      <!-- scrollable listings -->
      <div class="scrollarea" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 36px 28px;">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px;">
          <sc-for list="{{jobs}}" as="job" hint-placeholder-count="4">
            <a href="DetalleOferta.dc.html" style="display: block; background: #F7F4EC; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; border: 1px solid transparent;">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
                <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
                  <div style="width: 40px; height: 40px; border-radius: 10px; background: {{job.logoBg}}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex: none;">{{job.initials}}</div>
                  <div style="min-width: 0;">
                    <div style="font-size: 15px; font-weight: 600; color: #1C1B18; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{job.role}}</div>
                    <div style="font-size: 13px; color: #726C60; display: flex; align-items: center; gap: 6px;">
                      {{job.company}}
                      <sc-if value="{{job.verified}}" hint-placeholder-val="{{true}}">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="#1C5FA8" stroke="#fff" stroke-width="1.5"><path d="M12 2l2.4 1.9 3-.5 1 2.9 2.7 1.4-.9 3 1.7 2.5-2.4 2 .1 3-3 .4-1.6 2.5-2.9-.9-2.9.9-1.6-2.5-3-.4.1-3-2.4-2 1.7-2.5-.9-3 2.7-1.4 1-2.9 3 .5z"></path><path d="M9 12l2 2 4-4" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                      </sc-if>
                    </div>
                  </div>
                </div>
                <div style="text-align: right; flex: none;">
                  <div style="font-size: 18px; font-weight: 700; color: #1D7A4C;">{{job.match}}%</div>
                  <div style="font-size: 11px; color: #9B9488;">match</div>
                </div>
              </div>

              <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                <span style="font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 100px; background: #E7F1FB; color: #1C5FA8;">{{job.modality}}</span>
                <span style="font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 100px; background: #ECE7DA; color: #726C60;">{{job.location}}</span>
                <span style="font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 100px; background: {{job.responseBg}}; color: {{job.responseColor}};">{{job.responseLabel}}</span>
              </div>

              <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 2px;">
                <span style="font-size: 13px; font-weight: 600; color: #3D3A33;">{{job.salary}}</span>
                <span style="font-size: 12px; color: #9B9488;">Hace {{job.posted}}</span>
              </div>
            </a>
          </sc-for>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const modality = this.state.modality ?? 'all';

    const all = [
      { id: 1, role: 'Desarrolladora Frontend React', company: 'Nimbus Software', initials: 'NS', logoBg: '#1C5FA8', match: 91, modalityKey: 'remoto', modality: 'Remoto', location: 'Córdoba, AR', salary: 'AR$ 1.400.000 – 1.800.000', posted: '2 días', verified: true, response: 'fast' },
      { id: 2, role: 'Full Stack Developer', company: 'Bluecore Labs', initials: 'BL', logoBg: '#1D7A4C', match: 86, modalityKey: 'hibrido', modality: 'Híbrido', location: 'Buenos Aires, AR', salary: 'AR$ 1.600.000 – 2.000.000', posted: '1 día', verified: true, response: 'fast' },
      { id: 3, role: 'React Developer SSR', company: 'Atlas Tech', initials: 'AT', logoBg: '#B3760A', match: 78, modalityKey: 'remoto', modality: 'Remoto', location: 'Córdoba, AR', salary: 'AR$ 1.300.000 – 1.600.000', posted: '4 días', verified: false, response: 'slow' },
      { id: 4, role: 'Ingeniera de Software', company: 'Grupo Vértice', initials: 'GV', logoBg: '#726C60', match: 73, modalityKey: 'presencial', modality: 'Presencial', location: 'Rosario, AR', salary: 'AR$ 1.200.000 – 1.500.000', posted: '6 días', verified: true, response: 'none' },
      { id: 5, role: 'Frontend Engineer', company: 'Orbita Digital', initials: 'OD', logoBg: '#D97757', match: 68, modalityKey: 'remoto', modality: 'Remoto', location: 'Mendoza, AR', salary: 'AR$ 1.250.000 – 1.550.000', posted: '1 semana', verified: true, response: 'fast' },
      { id: 6, role: 'Desarrolladora JavaScript', company: 'Cedro Soft', initials: 'CS', logoBg: '#0F2E29', match: 64, modalityKey: 'hibrido', modality: 'Híbrido', location: 'Córdoba, AR', salary: 'AR$ 1.150.000 – 1.400.000', posted: '1 semana', verified: false, response: 'slow' },
    ];

    const responseMeta = {
      fast: { label: 'Responde rápido', bg: '#E6F6EC', color: '#1D7A4C' },
      slow: { label: 'Respuesta lenta', bg: '#FBF1DE', color: '#B3760A' },
      none: { label: 'Sin datos', bg: '#ECE7DA', color: '#726C60' },
    };

    const withMeta = all.map(j => ({
      ...j,
      responseLabel: responseMeta[j.response].label,
      responseBg: responseMeta[j.response].bg,
      responseColor: responseMeta[j.response].color,
    }));

    const jobs = modality === 'all' ? withMeta : withMeta.filter(j => j.modalityKey === modality);

    const pillStyle = (key) => {
      const active = modality === key;
      return {
        bg: active ? '#0F2E29' : '#fff',
        color: active ? '#fff' : '#3D3A33',
        border: active ? '#0F2E29' : '#DDD6C7',
      };
    };
    const pAll = pillStyle('all');
    const pRemoto = pillStyle('remoto');
    const pHibrido = pillStyle('hibrido');
    const pPresencial = pillStyle('presencial');

    return {
      jobs,
      resultsCount: jobs.length,

      filterAll: () => this.setState({ modality: 'all' }),
      filterRemoto: () => this.setState({ modality: 'remoto' }),
      filterHibrido: () => this.setState({ modality: 'hibrido' }),
      filterPresencial: () => this.setState({ modality: 'presencial' }),

      bgAll: pAll.bg, colorAll: pAll.color, borderAll: pAll.border,
      bgRemoto: pRemoto.bg, colorRemoto: pRemoto.color, borderRemoto: pRemoto.border,
      bgHibrido: pHibrido.bg, colorHibrido: pHibrido.color, borderHibrido: pHibrido.border,
      bgPresencial: pPresencial.bg, colorPresencial: pPresencial.color, borderPresencial: pPresencial.border,
    };
  }
}
</script>
</body>
</html>
