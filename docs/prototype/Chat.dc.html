<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mensajes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: #0F4C44; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .scrollarea::-webkit-scrollbar { width: 8px; }
  .scrollarea::-webkit-scrollbar-thumb { background: #DDD6C7; border-radius: 10px; }
  input::placeholder { color: #9B9488; }
</style>
</helmet>

<div style="width: 100%; height: 900px; background: #EDE7D8; padding: 36px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; overflow: hidden;">

  <div style="width: 100%; max-width: 1320px; height: 100%; background: #0F2E29; border-radius: 28px; padding: 14px; display: flex; gap: 14px; box-shadow: 0 30px 60px -20px rgba(15,46,41,0.35); box-sizing: border-box;">

    <!-- icon-only rail -->
    <div style="flex: 0 0 64px; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; position: relative;">
      <div style="width: 34px; height: 34px; border-radius: 9px; background: #D97757; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; flex: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F2E29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"></path></svg>
      </div>

      <a href="BuscarEmpleo.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Buscar empleo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
      </a>
      <a href="Dashboard.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mis postulaciones">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path></svg>
      </a>
      <div class="icon-btn" style="color: #9FBFB6;" title="Calendario">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      </div>
      <a href="AnalizadorCV.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Analizador de CV">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path><path d="M9 15l2 2 4-4"></path></svg>
      </a>
      <a href="MiPerfil.dc.html" class="icon-btn" style="color: #9FBFB6;" title="Mi perfil">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>

      <!-- ACTIVE item: Mensajes -->
      <div style="width: 60px; height: 48px; border-radius: 14px; background: #FFFFFF; color: #0F2E29; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(0,0,0,0.2); flex: none; position: relative;" title="Mensajes">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg>
        <span style="position: absolute; top: 2px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #D97757; border: 2px solid #fff;"></span>
      </div>

      <div class="icon-btn" style="color: #9FBFB6;" title="Configuración">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
      </div>

      <div style="margin-top: auto;">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: #D97757; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff;">SC</div>
      </div>
    </div>

    <!-- white content panel: fixed height, internal scroll -->
    <div style="flex: 1 1 0; min-width: 0; height: 100%; background: #FFFFFF; border-radius: 20px; box-sizing: border-box; display: flex; overflow: hidden;">

      <!-- conversations list -->
      <div style="flex: 0 0 300px; border-right: 1px solid #EFEBE0; display: flex; flex-direction: column; height: 100%;">
        <div style="padding: 24px 20px 14px; flex: none;">
          <h1 style="font-size: 19px; font-weight: 700; color: #1C1B18; margin: 0 0 12px;">Mensajes</h1>
          <div style="position: relative;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9B9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
            <input type="text" placeholder="Buscar conversación" style="width: 100%; box-sizing: border-box; padding: 9px 12px 9px 34px; border: 1px solid #DDD6C7; border-radius: 9px; font-size: 13px; background: #FAF8F3; color: #1C1B18;">
          </div>
        </div>

        <div class="scrollarea" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 10px 14px;">
          <sc-for list="{{conversations}}" as="c" hint-placeholder-count="4">
            <button onClick="{{c.select}}" style="width: 100%; text-align: left; border: none; background: {{c.bg}}; border-radius: 12px; padding: 12px; margin-bottom: 4px; display: flex; gap: 10px; align-items: flex-start;">
              <div style="width: 38px; height: 38px; border-radius: 10px; background: {{c.logoBg}}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: none;">{{c.initials}}</div>
              <div style="flex: 1; min-width: 0;">
                <div style="display: flex; justify-content: space-between; gap: 6px;">
                  <span style="font-size: 13px; font-weight: 700; color: #1C1B18; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{c.company}}</span>
                  <span style="font-size: 11px; color: #9B9488; flex: none;">{{c.time}}</span>
                </div>
                <div style="font-size: 12px; color: #9B9488; margin-bottom: 4px;">{{c.role}}</div>
                <div style="font-size: 12px; color: {{c.previewColor}}; font-weight: {{c.previewWeight}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{c.lastMessage}}</div>
              </div>
              <sc-if value="{{c.unread}}" hint-placeholder-val="{{false}}">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: #D97757; flex: none; margin-top: 4px;"></span>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </div>

      <!-- active thread -->
      <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; height: 100%;">

        <!-- thread header -->
        <div style="padding: 20px 28px; border-bottom: 1px solid #EFEBE0; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
          <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
            <div style="width: 40px; height: 40px; border-radius: 10px; background: {{active.logoBg}}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex: none;">{{active.initials}}</div>
            <div style="min-width: 0;">
              <div style="font-size: 14px; font-weight: 700; color: #1C1B18;">{{active.company}}</div>
              <div style="font-size: 12px; color: #726C60;">{{active.role}}</div>
            </div>
          </div>
          <span style="font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 100px; background: {{active.statusBg}}; color: {{active.statusColor}}; flex: none;">{{active.statusLabel}}</span>
        </div>

        <!-- messages -->
        <div class="scrollarea" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 28px; display: flex; flex-direction: column; gap: 12px;">
          <sc-for list="{{active.messages}}" as="m" hint-placeholder-count="4">
            <div style="display: flex; justify-content: {{m.align}};">
              <div style="max-width: 70%; background: {{m.bg}}; color: {{m.color}}; padding: 11px 15px; border-radius: 14px; font-size: 13px; line-height: 1.5;">
                {{m.text}}
                <div style="font-size: 10px; margin-top: 4px; opacity: 0.7;">{{m.time}}</div>
              </div>
            </div>
          </sc-for>
        </div>

        <!-- composer -->
        <div style="padding: 16px 28px; border-top: 1px solid #EFEBE0; flex: none; display: flex; gap: 10px; align-items: center;">
          <input type="text" placeholder="Escribí un mensaje..." style="flex: 1; box-sizing: border-box; padding: 11px 16px; border: 1px solid #DDD6C7; border-radius: 100px; font-size: 13px; background: #FAF8F3; color: #1C1B18;">
          <button style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #0F2E29; border: none; display: flex; align-items: center; justify-content: center;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const activeId = this.state.activeId ?? 2;

    const statusMeta = {
      review:    { label: 'En revisión', bg: '#FBF1DE', color: '#B3760A' },
      interview: { label: 'Entrevista',  bg: '#E7F1FB', color: '#1C5FA8' },
      accepted:  { label: 'Aceptada',    bg: '#E6F6EC', color: '#1D7A4C' },
    };

    const convosRaw = [
      {
        id: 1, company: 'Nimbus Software', role: 'Desarrolladora Frontend', initials: 'NS', logoBg: '#1C5FA8', time: 'ayer',
        lastMessage: 'Perfecto, quedamos así entonces.', unread: false, status: 'review',
        messages: [
          { from: 'them', text: 'Hola Sol, vimos tu postulación y tu perfil nos interesa mucho.', time: '10:02' },
          { from: 'me', text: '¡Hola! Gracias, quedo atenta a los próximos pasos.', time: '10:05' },
          { from: 'them', text: 'Perfecto, quedamos así entonces.', time: '10:06' },
        ],
      },
      {
        id: 2, company: 'Bluecore Labs', role: 'Full Stack Developer', initials: 'BL', logoBg: '#1D7A4C', time: '10:32',
        lastMessage: 'Te confirmamos la entrevista para mañana a las 10:00.', unread: true, status: 'interview',
        messages: [
          { from: 'them', text: 'Hola Sol, revisamos tu CV y nos gustaría avanzar con una entrevista técnica.', time: '09:40' },
          { from: 'me', text: '¡Genial! Me viene bien esta semana, decime qué día les queda mejor.', time: '09:55' },
          { from: 'them', text: 'Te confirmamos la entrevista para mañana a las 10:00 por Google Meet.', time: '10:32' },
        ],
      },
      {
        id: 3, company: 'Orbita Digital', role: 'Frontend Engineer', initials: 'OD', logoBg: '#D97757', time: 'lun',
        lastMessage: '¡Bienvenida al equipo! Te mandamos el contrato por mail.', unread: false, status: 'accepted',
        messages: [
          { from: 'them', text: 'Sol, queremos hacerte una oferta formal para el puesto.', time: '14:10' },
          { from: 'me', text: 'Me encantaría, muchas gracias por la oportunidad.', time: '14:20' },
          { from: 'them', text: '¡Bienvenida al equipo! Te mandamos el contrato por mail.', time: '14:25' },
        ],
      },
      {
        id: 4, company: 'Atlas Tech', role: 'React Developer SSR', initials: 'AT', logoBg: '#B3760A', time: 'vie',
        lastMessage: 'Gracias por tu tiempo, seguimos en contacto.', unread: false, status: 'review',
        messages: [
          { from: 'them', text: 'Hola Sol, gracias por postularte. Estamos revisando los perfiles.', time: '11:00' },
          { from: 'them', text: 'Gracias por tu tiempo, seguimos en contacto.', time: '11:01' },
        ],
      },
    ];

    const conversations = convosRaw.map(c => {
      const isActive = c.id === activeId;
      const meta = statusMeta[c.status];
      return {
        ...c,
        select: () => this.setState({ activeId: c.id }),
        bg: isActive ? '#F7F4EC' : 'transparent',
        previewColor: c.unread ? '#1C1B18' : '#9B9488',
        previewWeight: c.unread ? '600' : '400',
      };
    });

    const activeRaw = convosRaw.find(c => c.id === activeId);
    const meta = statusMeta[activeRaw.status];
    const active = {
      ...activeRaw,
      statusLabel: meta.label,
      statusBg: meta.bg,
      statusColor: meta.color,
      messages: activeRaw.messages.map(m => ({
        ...m,
        align: m.from === 'me' ? 'flex-end' : 'flex-start',
        bg: m.from === 'me' ? '#0F2E29' : '#F7F4EC',
        color: m.from === 'me' ? '#F3EFE6' : '#1C1B18',
      })),
    };

    return { conversations, active };
  }
}
</script>
</body>
</html>
